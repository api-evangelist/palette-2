aid: palette-2
name: Palette 2
description: >-
  Palette is AI-native media infrastructure and a multimodal creative platform
  from Y Combinator's Summer 2026 batch. It turns a single source of truth — a
  manual, brief, or document — into localized checklists, precise diagrams,
  images, music, and cinematic video tailored to every audience. Palette routes
  requests across leading generative models (ByteDance Seedance, Google Veo,
  Kling) inside a unified storyboard-to-final creative workflow, and exposes an
  authenticated developer API at studio.palettetechnology.com for programmatic
  generation and editing of multimedia content at scale.
